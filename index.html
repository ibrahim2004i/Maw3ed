
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موعد | دعوة زفاف</title>
  <meta name="description" content="دعوة زفاف إلكترونية مميزة">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px;
      display: grid;
      place-items: center;
      background: #eee8df;
      color: #514331;
      font-family: 'Cairo', sans-serif;
    }

    .invitation {
      width: 100%;
      max-width: 460px;
      min-height: 690px;
      padding: 42px 25px;
      text-align: center;
      position: relative;
      overflow: hidden;
      background: #fffdf8;
      border: 1px solid #c6aa77;
      outline: 5px solid #fffdf8;
      box-shadow: 0 15px 45px #62513b20;
    }

    .invitation::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid #d9c6a3;
      pointer-events: none;
    }

    .top {
      color: #a58751;
      font-size: 13px;
      letter-spacing: 2px;
    }

    .ornament {
      margin: 24px 0 12px;
      color: #b59a69;
      font-size: 27px;
    }

    h1 {
      margin: 12px 0;
      font-family: 'Amiri', serif;
      font-size: 39px;
      font-weight: 400;
    }

    .intro {
      font-family: 'Amiri', serif;
      font-size: 21px;
      line-height: 1.9;
    }

    .names {
      margin: 25px 0;
      color: #947346;
      font-family: 'Amiri', serif;
      font-size: 35px;
      line-height: 1.7;
    }

    .details {
      margin: 20px 0;
      font-size: 15px;
      line-height: 2.1;
    }

    .date {
      margin: 22px auto;
      padding: 13px 5px;
      max-width: 270px;
      border-top: 1px solid #d8c5a1;
      border-bottom: 1px solid #d8c5a1;
    }

    .location {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 22px;
      border: 1px solid #b49a6b;
      color: #735a34;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      margin-top: 25px;
      font-family: 'Amiri', serif;
      font-size: 19px;
    }

    @media (max-width: 380px) {
      .invitation { padding: 35px 18px; }
      h1 { font-size: 33px; }
      .names { font-size: 30px; }
    }
  </style>
</head>
<body>
  <main class="invitation">
    <div class="top">بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ</div>

    <div class="ornament">✧ ❦ ✧</div>

    <h1>دعوة لحضور حفل زفاف</h1>

    <div class="intro">
      بكل الحب والفرح<br>
      نتشرف بدعوتكم لمشاركتنا أجمل لحظات العمر
    </div>

    <div class="names">
      أحمد<br>
      <span style="font-size:22px">♥</span><br>
      نور
    </div>

    <div class="details">
      وذلك بمشيئة الله تعالى
      <div class="date">
        يوم الجمعة<br>
        20 تشرين الثاني 2026<br>
        الساعة الثامنة مساءً
      </div>
      قاعة الأفراح الملكية
    </div>

    <a class="location"
       href="https://maps.google.com/"
       target="_blank"
       rel="noopener">
      موقع القاعة على الخريطة
    </a>

    <div class="ornament">❦</div>

    <div class="footer">
      حضوركم يزيد فرحتنا<br>
      وبه تكتمل سعادتنا
    </div>
  </main>
</body>
</html>
